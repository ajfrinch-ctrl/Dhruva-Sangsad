name: Update VERSION with build time, build artifacts, and create release

on:
  push:
    paths:
      - 'VERSION'
      - '.github/workflows/update-version.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Read current version or set default
        id: vars
        run: |
          if [ -f VERSION ]; then
            line=$(head -n1 VERSION || true)
            ver=$(echo "$line" | sed -E 's/^Version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            if [ -z "$ver" ]; then
              ver="0.1.0"
            fi
          else
            ver="0.1.0"
          fi
          echo "current=$ver" >> "$GITHUB_OUTPUT"

      - name: Bump patch
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.vars.outputs.current }}"
          patch=$((patch + 1))
          new_version="$major.$minor.$patch"
          echo "new=$new_version" >> "$GITHUB_OUTPUT"

      - name: Write VERSION and commit
        id: write_version
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Version: ${{ steps.bump.outputs.new }} (build: $BUILD_TIME)" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }} (build: $BUILD_TIME)" || echo "no changes to commit"
          git push
          NEW_COMMIT=$(git rev-parse HEAD)
          echo "new_commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Build (if available)
        run: |
          if [ -f package.json ]; then
            npm run build || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/**

      - name: Create and push tag
        run: |
          TAG=v${{ steps.bump.outputs.new }}
          git tag -a "$TAG" -m "release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.bump.outputs.new }}
          name: v${{ steps.bump.outputs.new }}
          body: |
            Version: ${{ steps.bump.outputs.new }}
            Build time: ${{ steps.write_version.outputs.build_time }}
            Commit: ${{ steps.write_version.outputs.new_commit }}
          draft: false
          prerelease: false

      - name: Upload artifacts to release
        if: always()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump.outputs.new }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Show VERSION
        run: |
          echo "----- VERSION file -----"
          cat VERSION
