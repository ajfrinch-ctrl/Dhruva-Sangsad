<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="description" content="ধ্রুব সংসদ — Offline-first member, deposit, due, advance and reporting management system">
<title>ধ্রুব সংসদ | Dhruvo Sangsad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.png">
<link rel="apple-touch-icon" href="icons/logo.png">
<link rel="stylesheet" href="css/app.css?v=6.5.7">
<script src="vendor/firebase-app-compat.js" defer></script>
<script src="vendor/firebase-auth-compat.js" defer></script>
<script src="vendor/firebase-database-compat.js" defer></script>
<script src="vendor/jspdf.umd.min.js" defer></script>
<script src="vendor/jspdf.plugin.autotable.min.js" defer></script>
<script src="vendor/html2canvas.min.js" defer></script>
<script src="vendor/xlsx.full.min.js" defer></script>
</head>
<body>

<!-- ===== GUEST: login screen is the only visible screen ===== -->
<div id="authScreen" class="auth-wrap"></div>

<!-- ===== AUTHENTICATED APP SHELL (hidden until login) ===== -->
<div id="app" aria-hidden="true">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"><img src="icons/logo.png" alt=""></div>
      <div class="brand-txt">
        <div class="n">ধ্রুব সংসদ</div>
        <div class="r" id="brandRole">—</div>
      </div>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Settings" hidden></button>
      <button class="icon-btn" id="btnTheme" type="button" aria-label="Dark mode" title="হার্ড ডার্ক / Hard dark"></button>
      <button class="icon-btn" id="btnNotif" type="button" aria-label="Notifications"></button>
      <button class="icon-btn" id="btnLogout" type="button" aria-label="Logout"></button>
    </div>
  </header>
  <nav class="topnav" id="topnav" aria-label="Primary navigation"></nav>
  <main class="main" id="view"></main>
  <nav class="bottom-nav" id="bottomnav" hidden aria-label="Member navigation"></nav>
  <footer class="app-footer" id="appFooter">
    <div class="app-footer-org" id="appFooterOrg"></div>
  </footer>
</div>

<noscript><p style="padding:20px;font-family:sans-serif">This application requires JavaScript.</p></noscript>
<script type="module" src="js/app.js?v=6.5.7"></script>
</body>
</html>
